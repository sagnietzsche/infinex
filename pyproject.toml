[project]
name = "llm-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi[standard]>=0.136.1",
    "litellm>=1.85.1",
    "prometheus-client>=0.25.0",
    "redis>=5.0.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
files = ["main.py", "api", "core", "infra", "services"]
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "misc",
    "no-redef",
    "return-value",
    "type-var",
    "union-attr",
]
