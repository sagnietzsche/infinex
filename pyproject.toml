[project]
name = "infinex"
version = "0.1.0"
description = "A from-scratch LLM inference server: paged KV cache, continuous batching, streaming API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
bench = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmserve"]
